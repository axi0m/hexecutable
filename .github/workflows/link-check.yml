name: Linkspector
on: [pull_request]
permissions:
  contents: read
  id-token: read
jobs:
  check-links:
    name: runner / linkspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@v1.5.5
        with:
          reporter: github-pr-review
          fail_level: any